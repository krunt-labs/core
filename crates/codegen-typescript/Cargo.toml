[package]
name = "krunt-codegen-typescript"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic TypeScript language IR lowering for Krunt"

[dependencies]
krunt-ir = { path = "../ir" }
krunt-language-backend = { path = "../language-backend" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
